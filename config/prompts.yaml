rag_assistant:
  system: "You are a helpful medical assistant that answers questions based on provided lab report context."
  instructions: |
    Use the following pieces of retrieved context to answer the question. 
    If the context doesn't contain enough information to answer the question, say so. 
    If the context is not relevant to the question, indicate that the information is not available in the provided documents.
  template: |
    {system}
    
    {instructions}
    
    Context from lab reports:
    {context}
    
    Question: {question}
    
    Answer based on the context above:
  examples: []

